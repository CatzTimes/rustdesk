name: Build Android APK (armv7 + arm64)

# Fork distribution workflow: builds the release APKs (armeabi-v7a + arm64-v8a,
# debug signing config) for this independently maintained branch and uploads
# them as workflow artifacts. Mirrors the build-rustdesk-android job of
# flutter-build.yml for the two Android targets this branch supports.

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: build rustdesk android ${{ matrix.job.arch }} apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              abi: armeabi-v7a,
              triple: arm-linux-androideabi,
              ndk-script: ./flutter/ndk_arm.sh,
              flutter-target: android-arm,
            }
          - {
              arch: arm64,
              target: aarch64-linux-android,
              abi: arm64-v8a,
              triple: aarch64-linux-android,
              ndk-script: ./flutter/ndk_arm64.sh,
              flutter-target: android-arm64,
            }
    env:
      RUST_VERSION: "1.75"
      CARGO_NDK_VERSION: "3.1.2"
      ANDROID_FLUTTER_VERSION: "3.24.5"
      NDK_VERSION: "r28c"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libclang-dev \
               libunwind-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.ANDROID_FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          case ${{ matrix.job.target }} in
            armv7-linux-androideabi)
              ANDROID_TARGET=armeabi-v7a
            ;;
            aarch64-linux-android)
              ANDROID_TARGET=arm64-v8a
            ;;
          esac
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ${{ matrix.job.ndk-script }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # temporary use debug sign config
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          ABI_DIR=${{ matrix.job.abi }}
          RUST_TARGET=${{ matrix.job.target }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/$ABI_DIR
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.triple }}/libc++_shared.so ./flutter/android/app/src/main/jniLibs/$ABI_DIR/
          cp ./target/$RUST_TARGET/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/$ABI_DIR/librustdesk.so
          pushd flutter
          flutter build apk "--release" --target-platform ${{ matrix.job.flutter-target }} --split-per-abi
          popd
          mkdir -p apk-output
          case ${{ matrix.job.arch }} in
            armv7)  APK_NAME=rustdesk-1.5.0-shizuku-armv7.apk ;;
            arm64)  APK_NAME=rustdesk-1.5.0-shizuku-arm64.apk ;;
          esac
          cp flutter/build/app/outputs/flutter-apk/app-*-release.apk apk-output/$APK_NAME

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.arch }}-apk
          path: apk-output/*.apk
